name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - main.cuong.dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-service-tests:
    name: AuthService tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AuthService
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: wallet_auth_db
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: wallet_auth_db
      DB_USERNAME: wallet
      DB_PASSWORD: wallet123
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      JWT_SECRET: CI_EFEWallet_AuthService_JWT_Secret_Key_Must_Be_Long_Enough_123456789
      JWT_EXPIRATION_MS: "3600000"
      SERVER_PORT: "8083"
      SPRING_KAFKA_ADMIN_FAIL_FAST: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "127.0.0.1:9092"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: AuthService/pom.xml

      - name: Run tests
        run: ./mvnw -B -ntp clean test

  wallet-service-tests:
    name: WalletService tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: WalletService
    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: CI_EFEWallet_WalletService_JWT_Secret_Key_Must_Be_Long_Enough_123456789
      JWT_EXPIRATION_MS: "3600000"
      SPRING_KAFKA_ADMIN_FAIL_FAST: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: WalletService/pom.xml

      - name: Run tests
        run: ./mvnw -B -ntp clean test

  gateway-service-tests:
    name: GatewayService tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: GatewayService
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: GatewayService/pom.xml

      - name: Run tests
        run: ./mvnw -B -ntp clean test

  notification-service-build:
    name: NotificationService compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: NotificationService
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: NotificationService/pom.xml

      # Context tests need Redis/Kafka/Mail; compile/package until a test profile exists.
      - name: Compile
        run: ./mvnw -B -ntp clean package -DskipTests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npx next build EFE_Gui

  docker-build-smoke:
    name: Docker build smoke test
    needs:
      - auth-service-tests
      - wallet-service-tests
      - gateway-service-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: AuthService
            image: auth-service
            dockerfile: AuthService/Dockerfile
          - service: WalletService
            image: wallet-service
            dockerfile: WalletService/Dockerfile
          - service: GatewayService
            image: gateway-service
            dockerfile: GatewayService/Dockerfile
          - service: NotificationService
            image: notification-service
            dockerfile: NotificationService/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: >
          docker build
          -f "${{ matrix.dockerfile }}"
          -t "efewallet-${{ matrix.image }}:ci"
          "./${{ matrix.service }}"
