name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - main.cuong.dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-service-tests:
    name: AuthService - Unit/Context tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AuthService
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: wallet_auth_db
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: wallet_auth_db
      DB_USERNAME: wallet
      DB_PASSWORD: wallet123
      JWT_SECRET: CI_EFEWallet_AuthService_JWT_Secret_Key_Must_Be_Long_Enough_123456789
      JWT_EXPIRATION_MS: "3600000"
      SERVER_PORT: "8083"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp clean test

  transaction-service-tests:
    name: TransactionService - Unit/Context tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: TransactionService
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: wallet_transaction_db
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_transaction_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: wallet_transaction_db
      DB_USER: wallet
      DB_PASSWORD: wallet123
      JWT_SECRET: CI_EFEWallet_TransactionService_JWT_Secret_Key_Must_Be_Long_Enough_123456789
      JWT_EXPIRATION_MS: "3600000"
      SERVER_PORT: "8084"
      SPRING_JPA_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp clean test

  wallet-service-tests:
    name: WalletService - Unit/Context tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: WalletService
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp clean test

  docker-build-smoke:
    name: Docker build smoke test
    needs:
      - auth-service-tests
      - transaction-service-tests
      - wallet-service-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: AuthService
            dockerfile: AuthService/Dockerfile
          - service: TransactionService
            dockerfile: TransactionService/Dockerfile
          - service: WalletService
            dockerfile: WalletService/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "efewallet-${{ matrix.service }}:ci" "./${{ matrix.service }}"
