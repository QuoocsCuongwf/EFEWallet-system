spring.application.name=wallet-auth-service

# ========================
# Database Configuration
# ========================
# Hỗ trợ cả local (fallback) và Docker (env override)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:wallet_auth_db}
spring.datasource.username=${DB_USERNAME:wallet}
spring.datasource.password=${DB_PASSWORD:wallet123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ========================
# Server
# ========================
server.port=${SERVER_PORT:8083}

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET:QuoocsCuongwf_EFEWalletProject_AuthService_SecretKey_ChangeThisToAtLeast64BytesLong}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# "wallet-client"
spring.grpc.client.wallet-service.address=static://localhost:9090
spring.grpc.client.wallet-service.negotiation-type=plaintext
