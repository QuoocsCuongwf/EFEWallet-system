spring.application.name=wallet-auth-service

# ========================
# Database Configuration
# ========================
# Sử dụng trực tiếp các biến môi trường từ .env thông qua Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO}
# Ép kiểu Dialect để tránh lỗi khởi động khi dùng Docker
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ========================
# Server
# ========================
server.port=${SERVER_PORT}

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}