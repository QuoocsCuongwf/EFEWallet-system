<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EFEWallet Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>EFEWallet Desktop</h1>
        <p>Electron frontend for AuthService and WalletService.</p>
      </header>

      <section class="card">
        <h2>Backend Config</h2>
        <div class="grid two">
          <label>
            Auth API Base
            <input id="authBase" type="text" placeholder="http://localhost:8083/api/v1" />
          </label>
          <label>
            Wallet API Base
            <input id="walletBase" type="text" placeholder="http://localhost:8085/api/v1" />
          </label>
        </div>
        <button id="saveConfigBtn" type="button">Save Config</button>
      </section>

      <section class="card">
        <h2>Authentication</h2>
        <div class="grid two">
          <form id="registerForm">
            <h3>Register</h3>
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" minlength="6" required />
            <input name="firstName" type="text" placeholder="First name" required />
            <input name="lastName" type="text" placeholder="Last name" required />
            <button type="submit">Register</button>
          </form>

          <form id="loginForm">
            <h3>Login</h3>
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" required />
            <button type="submit">Login</button>
            <p class="hint">Token is stored locally for wallet calls.</p>
          </form>
        </div>
      </section>

      <section class="card">
        <h2>Wallet Actions</h2>
        <div class="actions">
          <button id="generateWalletBtn" type="button">Generate Wallet</button>
          <button id="getWalletBtn" type="button">Get Wallet Info</button>
          <button id="getBalanceBtn" type="button">Get Balance</button>
        </div>

        <form id="transferForm">
          <h3>Transfer</h3>
          <div class="grid two">
            <input name="toWalletAddress" type="text" placeholder="toWalletAddress" required />
            <input name="amount" type="number" min="0.0001" step="0.0001" placeholder="amount" required />
          </div>
          <div class="grid two">
            <input name="description" type="text" placeholder="Description" />
            <input name="referenceCode" type="text" placeholder="Reference code" />
          </div>
          <button type="submit">Transfer</button>
        </form>
      </section>

      <section class="card">
        <h2>Session</h2>
        <p id="tokenPreview">Token: (not logged in)</p>
      </section>

      <section class="card">
        <h2>Response</h2>
        <pre id="output"></pre>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
