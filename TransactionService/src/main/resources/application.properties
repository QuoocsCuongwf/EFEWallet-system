spring.application.name=TransactionService
spring.config.import=optional:file:.env[.properties]

# ========================
# Database Configuration (read from .env)
# ========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_transaction_db}
spring.datasource.username=${DB_USER:wallet}
spring.datasource.password=${DB_PASSWORD:wallet123}

# ========================
# JPA Configuration
# ========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

# ========================
# JWT Configuration (read from .env)
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ========================
# Server Configuration
# ========================
server.port=${SERVER_PORT:8084}
