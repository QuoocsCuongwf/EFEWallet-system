server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: wallet-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/wallet/**, /api/v1/transfer/**